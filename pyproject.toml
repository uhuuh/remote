[project.scripts]
mcp-bridge = "mcp_bridge.server:main"

[project]
name = "mcp-bridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "paramiko",
    "docker",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_backend"

[tool.setuptools.packages.find]
where = ["."]
